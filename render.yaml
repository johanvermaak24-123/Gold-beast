services:
  - type: web
    name: gold-regime-terminal
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: data
      - key: MAX_CLASSIFICATIONS_PER_REFRESH
        value: '40'
