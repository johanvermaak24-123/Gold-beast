<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1018"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Gold Intelligence</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--card:#141e2b;--edge:#273347;--ink:#e9eff8;--muted:#94a4ba;--gold:#e5c57c;--up:#61d7ae;--down:#fc8795}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:var(--gold);overflow-wrap:anywhere}header{padding:24px 20px 16px;max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:19px;font-weight:850;letter-spacing:.06em;color:var(--gold)}.kicker{font-size:10px;letter-spacing:.15em;color:var(--muted)}main{max-width:820px;margin:auto;padding:0 18px 115px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.card{padding:18px;background:var(--card);border:1px solid var(--edge);border-radius:16px;margin:12px 0;overflow:hidden}.card p:last-child{margin-bottom:0}h1{font-size:28px;line-height:1.2;margin:10px 0}h2{font-size:19px;margin:25px 0 8px}h3{font-size:15px;margin:0 0 9px}p{margin:8px 0}.muted,small{color:var(--muted);font-size:12px}.gold{color:var(--gold)}.up{color:var(--up)}.down{color:var(--down)}.pill{padding:5px 10px;border-radius:30px;border:1px solid var(--edge);color:var(--muted);font-size:11px;white-space:nowrap}.primary{background:var(--gold);border:0;color:#101820;font-weight:750;padding:12px 18px;border-radius:10px}.secondary{background:transparent;border:1px solid var(--edge);color:var(--gold);padding:9px 12px;border-radius:10px}.notice{border-left:3px solid var(--gold);padding:10px 14px;background:#211f20;border-radius:5px;margin:12px 0;color:var(--gold);font-size:13px}.error{border-color:var(--down);color:var(--down)}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#0d1420ed;border-top:1px solid var(--edge);padding:12px 6px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;backdrop-filter:blur(12px)}nav button{background:none;border:0;color:var(--muted);font-size:11px;min-width:0;max-width:180px;flex:1;padding:7px 2px}nav button[aria-selected=true]{color:var(--gold)}.tabicon{display:block;font-size:19px;margin-bottom:3px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0}.tabs button{flex-shrink:0}.tabs button.active{background:var(--gold);color:#101820;border-color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0c1520;padding:12px 5px;border-radius:10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:var(--muted)}.track{height:10px;background:#29364a;position:relative;border-radius:6px;margin:12px 0}.track:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#7b8b9d}.bar{position:absolute;top:0;height:10px;border-radius:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split .card{margin:0}input,select{width:100%;padding:12px;color:var(--ink);background:#0d1521;border:1px solid var(--edge);border-radius:9px;margin:8px 0}label{font-size:13px}details{font-size:12px;color:var(--muted);margin-top:10px}summary{cursor:pointer;color:var(--gold)}svg{width:100%;height:auto;display:block}.legend{display:flex;gap:8px;flex-wrap:wrap}.legend button{font-size:10px;padding:7px}.empty{text-align:center;padding:25px 12px}footer{font-size:11px;color:var(--muted);margin-top:25px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--gold)}#status{margin:0 0 12px}.hero{border-color:#655838;background:linear-gradient(135deg,#1a2534,#171d25)}.hero .decision{font-size:32px;font-weight:900;letter-spacing:.03em}.bigscore{font-size:27px;font-weight:800}.skeleton{animation:blink 1.2s infinite alternate}@keyframes blink{to{opacity:.45}}:focus-visible{outline:2px solid var(--gold);outline-offset:4px}@media(max-width:420px){.brand{font-size:16px}.split{grid-template-columns:1fr}.card{padding:15px}.stat b{font-size:19px}h1{font-size:25px}}
</style></head><body><header><div><div class="brand">AU / GOLD INTELLIGENCE</div><div class="kicker">REGIME · POSITIONING · CAPITAL FLOWS</div></div><button class="secondary" id="settings" aria-label="Connection settings">Connect</button></header><main><div id="status" class="muted" role="status">Opening your terminal…</div><div id="content"></div><footer>Research and decision support. No trade execution. Missing probabilities are unavailable—not zero. Source observations may lag market prices.</footer></main><nav aria-label="Main navigation" role="tablist"></nav>
<script>
'use strict';
const $=id=>document.getElementById(id);
const state={data:null,tab:'Regime',horizon:'24h',cluster:null,busy:false,error:'',backend:'',mode:'auto',updated:null,notice:'',run:0};
try{state.backend=localStorage.getItem('au.backend')||'';state.mode=localStorage.getItem('au.mode')||'auto';}catch{}
const colors=['#fc8795','#61d7ae','#e8a56a','#6ca9e9','#b77ee4','#7cbfac','#e5c57c','#a598e2','#cc9396','#88aeb9'];
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n;}
function add(parent,...nodes){for(const n of nodes)if(n)parent.append(n);return parent;}
function card(title){const n=el('section','card');if(title)n.append(el('h3','',title));return n;}
function button(text,fn,cls='secondary'){const b=el('button',cls,text);b.type='button';b.onclick=fn;return b;}
function num(v,d=2){return typeof v==='number'&&Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:d}):'Unavailable';}
function pct(v){return typeof v==='number'?`${(v*100).toFixed(1)}%`:'—';}
function when(v){if(!v)return 'Not supplied';const d=new Date(v);return Number.isNaN(+d)?String(v):d.toLocaleString();}
function safeLink(url,title){try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return el('span','muted',title||url);const a=el('a','',title||url);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a;}catch{return el('span','muted',title||'Source unavailable');}}
function factor(name){return state.data?.factors?.find(f=>f.name===name);}
function lineages(node,items){const d=el('details');d.append(el('summary','','Source lineage'));for(const x of items||[]){const p=el('p');add(p,safeLink(x.source),el('br'),el('small','',`${x.status||'unknown'} · Retrieved ${when(x.fetched_at)} · Observed ${x.data?.observed_at||x.observed_at||'not supplied'}`));d.append(p);}node.append(d);}
function empty(title,body){const c=card(title);c.classList.add('empty');add(c,el('p','muted',body));return c;}
function drawNav(){const nav=document.querySelector('nav');nav.replaceChildren();for(const [title,icon] of [['Regime','◈'],['Positioning','▥'],['Narratives','≋'],['Divergences','⇄']]){const b=button('',()=>{state.tab=title;render();window.scrollTo(0,0);},'');b.setAttribute('role','tab');b.setAttribute('aria-selected',state.tab===title);add(b,el('span','tabicon',icon),document.createTextNode(title));nav.append(b);}}
function render(){drawNav();const root=$('content');root.replaceChildren();
 const source=state.updated?` · ${state.updated}`:'';let stale=false;
 if(state.data?.generated_at)stale=Date.now()-Date.parse(state.data.generated_at)>(state.mode==='backend'?360000:6*3600000);
 $('status').textContent=state.busy?'Updating data…':state.error?'Update unavailable':state.data?`Report ${when(state.data.generated_at)}${source}`:'Not connected';
 if(state.error)root.append(el('div','notice error',state.error));if(state.error&&state.data)stale=true;if(stale)root.append(el('div','notice error','STALE REPORT — this is not a current trade decision.'));
 if(state.notice)root.append(el('div','notice',state.notice));
 if(!state.data){const c=card('Your GitHub Pages terminal');add(c,el('h1','','The app is ready to open.'),el('p','muted','Data arrives from the included GitHub Actions snapshot, or from your FastAPI server. No fabricated market readings are loaded.'),button('Connection & setup',setup,'primary'));root.append(c);root.append(empty('No current signal','Awaiting a data report. No trade decision is available.'));return;}
 if(state.tab==='Regime')renderRegime(root);else if(state.tab==='Positioning')renderPositions(root);else if(state.tab==='Narratives')renderNarratives(root);else renderAlerts(root);
}
function renderRegime(root){const r=state.data.intelligence;const legacy=state.data;
 const hero=card();hero.classList.add('hero');add(hero,el('div','kicker','CALCULATED MACRO CONTEXT · NOT AN ENTRY'),el('div','decision',legacy.bias==='Unavailable'||!legacy.bias?'INSUFFICIENT DATA':legacy.bias.toUpperCase()),el('p','gold',legacy.regime_label||'Insufficient evidence'),el('p','muted',`Fixed-weight score ${num(legacy.final_score)} · Available weight ${num(legacy.coverage_percent,0)}% · Dominant driver ${legacy.dominant_driver||'unavailable'}`),el('p','muted','This is a rule-based reading of the available factors, not a calibrated forecast or permission to enter a trade.'));root.append(hero);
 const entry=card('Trade-entry readiness');add(entry,el('p','gold',r?.final_decision==='BUY'||r?.final_decision==='SELL'?'Review engine decision and validation below':'NO VERIFIED ENTRY SIGNAL'),el('p','muted',r?.horizons?.['1h']?.reasons?.join(' · ')||r?.reason||'Intraday model, current execution data and validation are not connected.'));root.append(entry);
 const status=card('Source readiness');for(const f of legacy.factors||[]){add(status,el('p',f.status==='ok'?'up':'gold',`${f.name.replaceAll('_',' ')}: ${f.status}`));}add(status,el('p','muted','Connected means data was retrieved, not that the factor predicts the next move. Missing inputs are not redistributed.'));root.append(status);
 const horizons=el('div','tabs');for(const h of ['1h','4h','24h','5d','20d','60d']){const b=button(h.toUpperCase(),()=>{state.horizon=h;render();});if(state.horizon===h)b.classList.add('active');horizons.append(b);}root.append(horizons);
 const h=r?.horizons?.[state.horizon];const forecast=card(`${state.horizon.toUpperCase()} outlook`);const stats=el('div','stats');for(const [k,title] of [['bull','Bull'],['bear','Bear'],['range','Range']]){const cell=el('div','stat');add(cell,el('b',k==='bull'?'up':k==='bear'?'down':'',pct(h?.probabilities?.[k])),el('span','',title));stats.append(cell);}add(forecast,stats,el('p','muted',h?.probabilities?`${h.decision} · Directional confidence ${num(h.confidence,1)}% · Quality ${h.forecast_quality}`:'NO VALIDATED FORECAST — class probabilities unavailable'),el('p','muted',h?.probabilities?h.status:'A completed training and calibration process is required. These dashes do not mean a neutral price forecast.'));
 if(h?.reasons?.length){const detail=el('details');detail.append(el('summary','',`${h.reasons.length} readiness checks`));for(const reason of h.reasons)detail.append(el('p','muted',reason));forecast.append(detail);}
 if(h?.driver_paths){for(const [driver,p] of Object.entries(h.driver_paths))forecast.append(el('p','muted',`${driver}: up ${pct(p.bull)} / flat ${pct(p.range)} / down ${pct(p.bear)}`));}root.append(forecast);
 if(r?.review){const split=el('div','split');const bull=card('Strongest bullish case'),bear=card('Strongest bearish case');add(bull,el('p','up',r.review.strongest_bull_argument));add(bear,el('p','down',r.review.strongest_bear_argument));add(split,bull,bear);root.append(split);root.append(el('p','muted',`Driver conflict severity: ${pct(r.review.conflict_severity)} (not a probability)`));}
 root.append(el('h2','','Factor evidence'));for(const f of legacy.factors||[]){const c=card();const row=el('div','row');add(row,el('h3','',f.name.replaceAll('_',' ').toUpperCase()),el('span','pill',`${Math.round(f.weight*100)}% · ${f.signal==null?f.status:num(f.signal)}`));c.append(row);const track=el('div','track');if(typeof f.signal==='number'){const b=el('div','bar');const v=Math.max(-1,Math.min(1,f.signal));b.style.left=`${v>=0?50:50+v*50}%`;b.style.width=`${Math.abs(v)*50}%`;b.style.background=v>=0?'var(--up)':'var(--down)';track.append(b);}add(c,track,el('p','muted',f.reason));lineages(c,f.lineage);root.append(c);}
 if(r?.engines){const d=el('details');d.append(el('summary','','Ten-driver state monitor'));for(const e of r.engines){const c=card(e.engine.replaceAll('_',' '));add(c,el('p','muted',`${e.status} · ${e.resolution} · state ${num(e.gold_support)}`),el('p','muted',e.reason));lineages(c,e.lineage);d.append(c);}root.append(d);}
 const reload=button(state.busy?'Updating…':'Refresh published data',load);reload.disabled=state.busy;root.append(reload);
}
function spark(rows,key){const vals=rows.map(r=>Number(r[key]));if(vals.length<2||vals.some(v=>!Number.isFinite(v)))return el('p','muted','No chart history.');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 640 170');svg.setAttribute('role','img');svg.setAttribute('aria-label','Historical observations');const lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1;const pts=vals.map((v,i)=>`${8+i*624/(vals.length-1)},${145-(v-lo)/span*125}`).join(' ');const path=document.createElementNS(svg.namespaceURI,'polyline');path.setAttribute('points',pts);path.setAttribute('fill','none');path.setAttribute('stroke','#e5c57c');path.setAttribute('stroke-width','2.5');svg.append(path);return svg;}
function renderPositions(root){root.append(el('h1','','Positioning & flows'));const f=factor('positioning'),p=f?.details||{};const c=card('COMEX Gold · Managed money');add(c,el('span','pill',f?.status||'Unavailable'),el('p','bigscore',p.net_contracts==null?'Unavailable':`${num(p.net_contracts,0)} contracts net`),el('p','gold',`156-prior-report percentile: ${num(p.percentile,1)}${p.percentile!=null?'%':''}`));const band=el('div','track');band.style.background='linear-gradient(90deg,#265949 0% 15%,#29364a 15% 85%,#753f4b 85% 100%)';if(p.percentile!=null){const mark=el('span');Object.assign(mark.style,{position:'absolute',height:'18px',width:'3px',top:'-4px',left:`${Math.min(99,p.percentile)}%`,background:'var(--gold)'});band.append(mark);}add(c,band,el('p','muted','Below 15%: washed out · Above 85%: crowded long. Not reversal timing.'),spark(p.history||[],'net'),el('p','muted',`Positions observed ${p.observed_at||'unknown'}. Report publication is delayed.`));lineages(c,f?.lineage);root.append(c);
 const flows=factor('flows');for(const e of flows?.details?.etfs||[]){const item=card(`${e.fund} holdings change · tonnes`);add(item,spark(e.rows,'change_tonnes'),el('p','muted',`20-observation change: ${num(e.change_20_sessions_tonnes)}t · ${e.observed_at}`));root.append(item);}if(!flows?.details?.etfs?.length)root.append(empty('ETF & central-bank flows',flows?.reason||'Verified holdings and quarterly purchase data are not connected. Prices are not fund flows.'));
}
function renderNarratives(root){root.append(el('h1','','Narrative clusters'));const n=factor('narrative'),d=n?.details||{};root.append(el('p','muted','Topic density, not headline sentiment. Blank periods mean missing evidence.'));const regimes=Object.keys(d.windows?.['24']?.density||{}),series=d.series_72h||[];
 if(!regimes.length||!series.length){root.append(empty('No classified narrative archive',n?.reason||'Connect your backend with a structured-output model and a persistent news archive. No paid model calls are made by this page.'));return;}
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 640 200');svg.setAttribute('role','img');svg.setAttribute('aria-label','72-hour topic density');let base=series.map(()=>0);
 regimes.forEach((reg,k)=>{const top=series.map((row,i)=>base[i]+(row.density[reg]||0));const x=i=>i*640/series.length;const pts=top.flatMap((v,i)=>[`${x(i)},${180-v*180}`,`${x(i+1)},${180-v*180}`]).concat(base.flatMap((_,i)=>{const j=base.length-1-i;return [`${x(j+1)},${180-base[j]*180}`,`${x(j)},${180-base[j]*180}`];}));base=top;const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',`M${pts.join(' L')} Z`);p.setAttribute('fill',colors[k%colors.length]);p.onclick=()=>{state.cluster=reg;render();};svg.append(p);});root.append(svg);
 const legend=el('div','legend');regimes.forEach((reg,i)=>{const b=button(`${reg} ${pct(d.windows['24'].density[reg])}`,()=>{state.cluster=reg;render();});b.style.color=colors[i%colors.length];legend.append(b);});root.append(legend);
 root.append(el('h2','',state.cluster||'Choose a topic'));for(const a of (d.articles||[]).filter(a=>a.label?.regime===state.cluster)){const c=card();add(c,safeLink(a.url,a.title),el('p','muted',`${a.source} · ${when(a.published_at)}`),el('p','muted',a.label.reason));root.append(c);}
}
function renderAlerts(root){root.append(el('h1','','Divergence alerts'));const alerts=state.data.divergences||[];if(!alerts.length)root.append(empty('No verified divergence',state.data.coverage_percent<100?'Incomplete coverage can hide conflicts. Absence of an alert does not mean factors agree.':'No configured divergence condition is active.'));
 for(const a of alerts){const c=card(a.type.replaceAll('_',' '));add(c,el('p','gold',a.message),el('p','muted',when(a.detected_at)));for(const [key,items] of Object.entries(a.lineage||{})){c.append(el('p','muted',key));lineages(c,items);}root.append(c);}for(const message of state.data.intelligence?.invalidation||[])root.append(el('p','muted','• '+message));
}
function setup(){state.tab='Settings';drawNav();const root=$('content');root.replaceChildren();root.append(el('h1','','Connection'));const c=card('Choose your data source');const select=el('select');select.setAttribute('aria-label','Data source');for(const [v,t] of [['auto','GitHub snapshot (no separate server)'],['backend','FastAPI live backend']]){const opt=el('option','',t);opt.value=v;opt.selected=state.mode===v;select.append(opt);}const input=el('input');input.type='url';input.placeholder='https://your-backend.example';input.value=state.backend;input.setAttribute('aria-label','Backend URL');const msg=el('p','muted');const save=button('Save & connect',()=>{try{if(select.value==='backend'){const u=new URL(input.value.trim());if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw new Error('Use a public HTTPS backend URL without keys or credentials.');state.backend=u.href.replace(/\/+$/,'');}state.mode=select.value;try{localStorage.setItem('au.backend',state.backend);localStorage.setItem('au.mode',state.mode);}catch{}state.data=null;state.notice='';state.tab='Regime';load(true);}catch(e){msg.textContent=e.message;msg.className='down';}},'primary');add(c,select,input,msg,save);root.append(c);root.append(el('div','notice','GitHub Pages hosts this app. The included Actions workflow builds data/latest.json periodically. It is not a live tick feed. With only index.html uploaded, direct CFTC positioning is attempted as a limited fallback.'));root.append(el('p','muted','Never paste an API key here. HTTPS Pages cannot call an HTTP backend. Browser access also requires your backend CORS configuration.'));root.append(button('Back',()=>{state.tab='Regime';render();}));}
async function fetchJson(url,timeout=30000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const response=await fetch(url,{signal:c.signal,cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);return await response.json();}finally{clearTimeout(timer);}}
async function directCot(){const params=new URLSearchParams({'$where':"cftc_contract_market_code='088691'",'$select':'report_date_as_yyyy_mm_dd,m_money_positions_long_all,m_money_positions_short_all,open_interest_all','$order':'report_date_as_yyyy_mm_dd DESC','$limit':'180'});const url='https://publicreporting.cftc.gov/resource/72hh-3qpy.json?'+params;const raw=await fetchJson(url);if(!Array.isArray(raw))throw new Error('Unexpected CFTC response');const rows=raw.map(r=>({date:r.report_date_as_yyyy_mm_dd.slice(0,10),net:Number(r.m_money_positions_long_all)-Number(r.m_money_positions_short_all),long:Number(r.m_money_positions_long_all),short:Number(r.m_money_positions_short_all)})).filter(r=>Number.isFinite(r.net)&&r.date<=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date));if(rows.length<157)throw new Error('Insufficient COT history');const latest=rows.at(-1),past=rows.slice(-157,-1);const percentile=100*(past.filter(r=>r.net<latest.net).length+.5*past.filter(r=>r.net===latest.net).length)/156;const stale=Date.now()-Date.parse(latest.date)>10*86400000;const signal=stale?null:percentile>85?-(percentile-85)/15:percentile<15?(15-percentile)/15:0;return {generated_at:new Date().toISOString(),regime_label:'Positioning context only',coverage_percent:stale?0:25,confidence:0,divergences:[],factors:[{name:'positioning',weight:.25,status:stale?'stale':'ok',signal,reason:'Direct CFTC public API. This is one weekly factor, not a gold forecast.',lineage:[{source:'https://publicreporting.cftc.gov/resource/72hh-3qpy.json',fetched_at:new Date().toISOString(),status:stale?'stale':'ok',observed_at:latest.date}],details:{percentile,net_contracts:latest.net,history:rows.slice(-157),observed_at:latest.date}}]};}
async function load(force=false){if(state.busy&&force!==true)return;const run=++state.run;state.busy=true;state.error='';render();try{let data,updated,notice='';
 if(state.mode==='backend'){if(!state.backend)throw new Error('Set your HTTPS backend in Connect.');data=await fetchJson(state.backend+'/regime',180000);updated='Backend';}
 else{try{data=await fetchJson(new URL('data/latest.json',location.href));updated='GitHub scheduled snapshot';notice='Periodic report, not executable live pricing. Refresh fetches the latest published file; it does not run the server.';}catch{data=await directCot();updated='CFTC direct';notice='Limited mode: only weekly CFTC positioning is connected. Upload the full GitHub package and enable its Actions workflow for the macro report, or connect FastAPI.';}}
 if(!data||!Array.isArray(data.factors)||!Array.isArray(data.divergences)||!data.generated_at)throw new Error('Unexpected report format');
 if(run!==state.run)return;state.data=data;state.updated=updated;state.notice=notice;
 }catch(e){if(run!==state.run)return;state.error='Data could not be updated. '+(e.name==='AbortError'?'Request timed out.':e.message);if(!state.data)state.notice='The app opens independently of data services. Use Connect to configure a source; no readings are fabricated.';}
 finally{if(run===state.run){state.busy=false;if(state.tab!=='Settings')render();}}}
$('settings').onclick=setup;load();setInterval(()=>{if(!document.hidden&&state.tab!=='Settings')load();},300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.tab!=='Settings')load();});
</script></body></html>
